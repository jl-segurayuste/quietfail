[project]
name = "quietfail"
version = "0.2.0"
description = "Encuentra scripts, unidades systemd, crontabs y workflows de CI que registran un error pero igualmente terminan en éxito (exit 0)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
quietfail = "quietfail.cli:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quietfail*"]

[tool.ruff]
line-length = 100
target-version = "py311"
